[project]
name = "squelch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mike Else", email = "melse@jellyvision.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.1",
    "sounddevice>=0.5.5",
    "starlette>=1.9.0,<2",
    "textual>=8.2.8,<9",
    "uvicorn>=0.54.0,<0.55",
    "websockets>=17.2,<18",
]

[project.scripts]
squelch = "squelch.__main__:main"
kcgx-airport = "kcgx.__main__:main"
kcgx-status = "kcgx.status:main"
kcgx-web = "kcgx.server:main"
kcgx = "kcgx.launcher:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["squelch", "kcgx"]

[dependency-groups]
dev = [
    "httpx2>=2.14.0,<3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
# The page's own tests drive a real browser: `uv sync --group browser` and
# `uv run playwright install chromium`. Without them those tests skip.
browser = [
    "playwright==1.56.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["browser: drives the cockpit page in a real browser (skips without Playwright)"]
