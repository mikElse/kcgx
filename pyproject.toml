[project]
name = "squelch"
version = "0.1.0"
description = "KCGX: live ATC audio and traffic around an airport, in your browser"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mike Else", email = "mikelse@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.1",
    "sounddevice>=0.5.5",
    "starlette>=1.9.0,<2",
    "uvicorn>=0.54.0,<0.55",
    "websockets>=17.2,<18",
]

[project.urls]
Homepage = "https://github.com/mikElse/kcgx"

[project.scripts]
kcgx = "kcgx.launcher:main"
kcgx-web = "kcgx.server:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["squelch", "kcgx"]

[dependency-groups]
dev = [
    "httpx2>=2.14.0,<3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
# The page's own tests drive real browsers, Chromium and WebKit:
# `uv sync --group browser` and `uv run playwright install chromium webkit`.
# Without the group those tests skip; without one browser, its half of them.
browser = [
    "playwright==1.56.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["browser: drives the cockpit page in a real browser (skips without Playwright)"]
