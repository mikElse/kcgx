# kcgx cockpit — session-local tmux config.
#
# Applied with `tmux -f`, so it configures only the kcgx session and never
# touches ~/.tmux.conf. You can keep using tmux normally elsewhere without
# inheriting any of this.

# Mouse mode is the whole point: drag a pane border to resize.
# tmux intercepts border drags; clicks and scrolls inside a pane are forwarded
# to the application if it has requested mouse reporting. squelch (Textual)
# does, so its feed picker stays clickable. adsb-tui likely does not, so
# scrolling over it enters tmux copy-mode — which gives you scrollback over the
# traffic table for free.
set -g mouse on

# A dead pane stays visible with its final output and exit status instead of
# silently collapsing the layout. For a monitoring cockpit, noticing that
# something died is the entire point.
set -g remain-on-exit on

# prefix + r respawns the pane under the cursor, in place.
bind r respawn-pane -k

# prefix + a opens the airport search over the cockpit. display-popup -E
# closes the popup when the command exits, and the retarget happens inside
# it — a popup's pty is destroyed on close, so nothing it prints can be
# read by the caller.
#
# No KCGX_SESSION or KCGX_SOCKET is passed, so this reaches the default
# session on the default socket. A cockpit opened under a non-default
# session name cannot be retargeted from its own popup — it has to be
# `kcgx go` from the shell pane, where the environment is inherited. Not
# handled rather than not noticed: tmux would have to interpolate the
# running session's name into the bound command, and the default is the
# only one anybody actually runs.
bind a display-popup -E -w 64 -h 20 "kcgx go"

# No status bar: this is a dedicated cockpit and the row is better spent on the
# transcript. Turn it on for a session with `prefix + :` then `set status on`.
set -g status off

# Resize to the smallest client actually looking at a window, not the smallest
# client attached to the session.
setw -g aggressive-resize on

set -g history-limit 20000
set -g escape-time 10
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
